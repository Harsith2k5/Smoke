<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FloodResQ VR • Zyntra’s ResQNet</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      .a-enter-vr-button {
        background: linear-gradient(90deg, #00eaff, #00ffaa) !important;
        color: #000 !important;
        border-radius: 14px !important;
        font-weight: bold !important;
        font-size: 16px !important;
        box-shadow: 0 0 10px #00ffff;
      }
      #loader {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        color: #00ffff;
        font-size: 22px;
        text-shadow: 0 0 10px #00eaff;
      }
    </style>
  </head>

  <body>
    <div id="loader">🌊 Initializing Zyntra’s ResQNet...</div>

    <a-scene>
      <a-sky color="#001a33"></a-sky>

      <!-- 🌊 Flood Water -->
      <a-plane id="water" color="#004488" width="100" height="100"
               rotation="-90 0 0" position="0 0 0">
        <a-animation attribute="position" direction="alternate" dur="4000"
                     repeat="indefinite" to="0 0.3 0"></a-animation>
      </a-plane>

      <!-- 👁️ Camera rig with fixed UI (so it stays visible in VR) -->
      <a-entity id="rig" position="0 1.6 0">
        <a-entity id="camera" camera look-controls wasd-controls="enabled: false"></a-entity>

        <!-- 🎛️ HUD UI (attached to camera rig) -->
        <a-entity id="ui" position="0 0 -3.5" scale="1.2 1.2 1.2">
          <!-- 📊 Sensor Panel -->
          <a-entity id="data-panel" position="0 1 0">
            <a-plane color="#002244" width="3.8" height="2" opacity="0.8"></a-plane>
            <a-text id="rain" value="🌧 Rainfall: -- mm" color="#00eaff" position="-1.5 0.6 0" align="left"></a-text>
            <a-text id="river" value="🌊 River: -- m" color="#00ffaa" position="-1.5 0.2 0" align="left"></a-text>
            <a-text id="temp" value="🌡 Temp: -- °C" color="#ffaa00" position="-1.5 -0.2 0" align="left"></a-text>
            <a-text id="humidity" value="💧 Humidity: -- %" color="#66ff66" position="-1.5 -0.6 0" align="left"></a-text>
          </a-entity>

          <!-- 🚨 Alert -->
          <a-text id="alert" value="" color="#ff4444" position="0 2.4 0" align="center" scale="2 2 2"></a-text>

          <!-- 🧠 Quiz Panel -->
          <a-entity id="quiz-panel" position="0 -1.2 0" visible="false">
            <a-plane id="quiz-bg" color="#002244" width="4" height="2.5" opacity="0.85"></a-plane>
            <a-text id="question" value="" color="#ffffff" position="0 0.8 0" align="center" width="3.5"></a-text>

            <a-text id="opt1" value="" color="#00ffff" position="0 0.4 0" align="center"></a-text>
            <a-text id="opt2" value="" color="#00ffff" position="0 0.1 0" align="center"></a-text>
            <a-text id="opt3" value="" color="#00ffff" position="0 -0.2 0" align="center"></a-text>
            <a-text id="opt4" value="" color="#00ffff" position="0 -0.5 0" align="center"></a-text>
            <a-text id="timer" value="" color="#ffaa00" position="0 -1 0" align="center"></a-text>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const GEMINI_API_KEY = "AIzaSyDZ5D8HxWapV3dYQmn_4mvOwMIlRJUxwrI";
      const WEATHER_API = "https://api.open-meteo.com/v1/forecast?latitude=13.0827&longitude=80.2707&current_weather=true&hourly=precipitation";

      const questions = [
        { q: "Water levels are rising and live wires are visible. What should you do?", opts: ["Move to higher ground", "Touch the wires", "Wait in water", "Swim towards lines"], ans: 0 },
        { q: "A person is stranded on a floating car. What’s your first action?", opts: ["Mark location & call help", "Jump into water", "Throw rope", "Wait till car sinks"], ans: 0 },
        { q: "Which is safest shelter during heavy floods?", opts: ["Lowland", "Rooftop of tall building", "Open field", "River bank"], ans: 1 },
        { q: "Before using a rescue boat, what’s crucial?", opts: ["Check fuel", "Wear life jacket", "Play siren", "Wave hands"], ans: 1 },
        { q: "If communication fails, what should you do?", opts: ["Panic", "Use visual signals", "Wait silently", "Abandon rescue"], ans: 1 }
      ];

      async function fetchFloodData() {
        try {
          const res = await fetch(WEATHER_API);
          const data = await res.json();
          const temp = data.current_weather?.temperature || 0;
          const rain = data.hourly?.precipitation?.[0] || 0;
          const humidity = 65 + Math.random() * 25;
          const river = 2 + rain / 4;
          const floodRisk = rain > 15 || river > 5;

          const info = { temp, rain, humidity, river, floodRisk };
          updateScene(info);
          await aiNarrate(info);

          document.getElementById("loader").style.display = "none";
          setTimeout(() => startQuiz(), 4000);
        } catch (err) {
          console.warn("Error:", err);
        }
      }

      function updateScene(data) {
        document.querySelector("#rain").setAttribute("value", `🌧 Rainfall: ${data.rain.toFixed(1)} mm`);
        document.querySelector("#river").setAttribute("value", `🌊 River: ${data.river.toFixed(1)} m`);
        document.querySelector("#temp").setAttribute("value", `🌡 Temp: ${data.temp.toFixed(1)} °C`);
        document.querySelector("#humidity").setAttribute("value", `💧 Humidity: ${data.humidity.toFixed(1)} %`);

        const water = document.querySelector("#water");
        const alert = document.querySelector("#alert");

        if (data.floodRisk) {
          water.setAttribute("color", "#004cff");
          water.setAttribute("position", "0 0.4 0");
          alert.setAttribute("value", "⚠️ FLOOD RISK DETECTED ⚠️");
        } else {
          water.setAttribute("color", "#004488");
          water.setAttribute("position", "0 0 0");
          alert.setAttribute("value", "");
        }
      }

      async function aiNarrate(data) {
        const prompt = `Flood data:
        Rainfall: ${data.rain} mm,
        River: ${data.river} m,
        Humidity: ${data.humidity}%,
        Temperature: ${data.temp}°C.
        Give a short 2-line calm instruction for rescuers in flood zones.`;

        const res = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + GEMINI_API_KEY,
          { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) }
        );

        const j = await res.json();
        const text = j?.candidates?.[0]?.content?.parts?.[0]?.text ||
          "Stay alert. Move to higher ground. Prioritize safety.";

        const aiText = document.createElement("a-text");
        aiText.setAttribute("value", `🤖 ${text}`);
        aiText.setAttribute("color", "#00ffff");
        aiText.setAttribute("position", "0 0 -2");
        aiText.setAttribute("align", "center");
        aiText.setAttribute("scale", "1.2 1.2 1.2");
        document.getElementById("ui").appendChild(aiText);

        const utter = new SpeechSynthesisUtterance(text);
        speechSynthesis.speak(utter);
      }

      // 🧩 Quiz
      let currentQ = 0;
      let timer;

      function startQuiz() {
        const panel = document.getElementById("quiz-panel");
        panel.setAttribute("visible", "true");
        animatePanel(panel);
        showQuestion(currentQ);
      }

      function animatePanel(panel) {
        panel.setAttribute("animation", {
          property: "scale",
          from: "0.5 0.5 0.5",
          to: "1 1 1",
          dur: 800,
          easing: "easeOutElastic"
        });
      }

      function showQuestion(i) {
        const q = questions[i];
        document.getElementById("question").setAttribute("value", q.q);
        q.opts.forEach((opt, idx) => {
          const el = document.getElementById(`opt${idx + 1}`);
          el.setAttribute("value", `${idx + 1}. ${opt}`);
          el.setAttribute("color", "#00ffff");
        });

        let t = 10;
        document.getElementById("timer").setAttribute("value", `⏳ ${t}s`);
        clearInterval(timer);
        timer = setInterval(() => {
          t--;
          document.getElementById("timer").setAttribute("value", `⏳ ${t}s`);
          if (t === 0) {
            clearInterval(timer);
            showAnswer(i);
          }
        }, 1000);
      }

      function showAnswer(i) {
        const correct = questions[i].ans + 1;
        document.getElementById(`opt${correct}`).setAttribute("color", "#00ff00");
        document.getElementById("timer").setAttribute("value", "✅ Correct: " + questions[i].opts[questions[i].ans]);
        setTimeout(() => nextQuestion(), 4000);
      }

      function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) {
          animatePanel(document.getElementById("quiz-panel"));
          showQuestion(currentQ);
        } else {
          document.getElementById("quiz-panel").setAttribute("visible", "false");
          const done = document.createElement("a-text");
          done.setAttribute("value", "🎉 Training Complete! Excellent Work Rescuer!");
          done.setAttribute("color", "#00ffcc");
          done.setAttribute("position", "0 1 0");
          done.setAttribute("align", "center");
          done.setAttribute("scale", "1.5 1.5 1.5");
          document.getElementById("ui").appendChild(done);
          speechSynthesis.speak(new SpeechSynthesisUtterance("Training complete! Excellent work, Rescuer!"));
        }
      }

      window.onload = fetchFloodData;
    </script>
  </body>
</html>
