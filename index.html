<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Zyntra's ResQNet VR Command Center</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      .a-enter-vr-button { background: #007bff !important; border-radius: 10px; font-weight: bold; }
    </style>
  </head>

  <body>
    <a-scene background="color: #001018">
      <!-- 🌌 Sky + Water -->
      <a-sky color="#00081a"></a-sky>
      <a-plane id="water" color="#002244" width="60" height="60" rotation="-90 0 0" position="0 0 0"></a-plane>

      <!-- 🧭 Title -->
      <a-text value="🌐 Zyntra's ResQNet Command Center" position="0 3 -2" color="#00ffff" align="center" scale="2 2 2"></a-text>

      <!-- 📊 Front block -->
      <a-entity id="block-front" position="0 1.6 -3">
        <a-plane color="#001f33" width="2.8" height="1.5" opacity="0.7"></a-plane>
        <a-text id="distance" value="📏 Distance: -- cm" color="#00eaff" position="-1.2 0.5 0.01"></a-text>
        <a-text id="temp" value="🌡 Temp: -- °C" color="#ffaa00" position="-1.2 0.2 0.01"></a-text>
        <a-text id="humidity" value="💧 Humidity: -- %" color="#66ff66" position="-1.2 -0.1 0.01"></a-text>
        <a-text id="air" value="🌫 AQI: --" color="#ff66cc" position="-1.2 -0.4 0.01"></a-text>
      </a-entity>

      <!-- 🤖 AI Block (Right side) -->
      <a-entity id="ai-block" position="3 1.6 0" rotation="0 -90 0">
        <a-plane color="#112244" width="2.6" height="1.1" opacity="0.8"></a-plane>
        <a-text value="🤖 AI Guidance" color="#00ffcc" position="-1.1 0.35 0.01" align="left"></a-text>
        <a-text id="ai-suggestion" value="Awaiting analysis..." color="#ffffff" position="-1.1 0 0.01" wrap-count="42" align="left"></a-text>
      </a-entity>

      <!-- ☁️ Weather (Left side) -->
      <a-entity id="weather-block" position="-3 1.6 0" rotation="0 90 0">
        <a-plane color="#222244" width="2.6" height="1.1" opacity="0.8"></a-plane>
        <a-text value="☁️ Environment" color="#77aaff" position="-1.1 0.35 0.01" align="left"></a-text>
        <a-text id="weather-data" value="Loading..." color="#ffffff" position="-1.1 0 0.01" wrap-count="42" align="left"></a-text>
      </a-entity>

      <!-- 🧠 System Log (Back) -->
      <a-entity id="system-block" position="0 1.6 3" rotation="0 180 0">
        <a-plane color="#331144" width="2.6" height="1.1" opacity="0.8"></a-plane>
        <a-text value="🧠 System Log" color="#cc66ff" position="-1.1 0.35 0.01" align="left"></a-text>
        <a-text id="system-log" value="Initializing systems..." color="#ffffff" position="-1.1 0 0.01" wrap-count="42" align="left"></a-text>
      </a-entity>

      <!-- 🚨 Alert -->
      <a-text id="alert" value="" color="#ff0000" position="0 2.6 -2" align="center" scale="2 2 2"></a-text>

      <!-- 🔊 Flood Sound -->
      <a-sound id="alertSound"
        src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_69b624fd7a.mp3?filename=alarm-6004.mp3"
        autoplay="false">
      </a-sound>

      <!-- 👁️ Camera -->
      <a-entity camera look-controls position="0 1.6 0"></a-entity>
    </a-scene>

    <script>
      const ESP_IP = "http://172.20.10.2/data";
      const GEMINI_API_KEY = "AIzaSyDZ5D8HxWapV3dYQmn_4mvOwMIlRJUxwrI";
      let aiSpeaking = false;

      // 🧠 Fetch all data once
      window.onload = async () => {
        try {
          const res = await fetch(ESP_IP);
          const data = await res.json();

          updateScene(data);
          await fetchAI(data);
        } catch (err) {
          console.error("Error fetching ESP32 data:", err);
          document.querySelector("#system-log").setAttribute("value", "⚠️ Unable to reach IoT device.");
        }
      };

      // 🤖 AI Suggestion
      async function fetchAI(data) {
        try {
          const prompt = `You are ResQNet AI. Based on the sensor readings: 
Distance=${data.distance_cm}cm, Temperature=${data.temp_c}°C, Humidity=${data.humidity_pct}%, and Air Quality=${data.air_quality_pct}%. 
Provide a short, precise flood rescue instruction (max 2 sentences).`;
          
          const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + GEMINI_API_KEY, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });

          const result = await res.json();
          const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "No AI output.";

          displayTextFlow("#ai-suggestion", aiText);
          speak(aiText);

        } catch (err) {
          console.error("AI fetch failed:", err);
        }
      }

      // 🧱 Scene update
      function updateScene(data) {
        document.querySelector("#distance").setAttribute("value", `📏 Distance: ${data.distance_cm.toFixed(1)} cm`);
        document.querySelector("#temp").setAttribute("value", `🌡 Temp: ${data.temp_c.toFixed(1)} °C`);
        document.querySelector("#humidity").setAttribute("value", `💧 Humidity: ${data.humidity_pct.toFixed(1)} %`);
        document.querySelector("#air").setAttribute("value", `🌫 AQI: ${data.air_quality_pct.toFixed(1)} %`);

        const water = document.querySelector("#water");
        const alertText = document.querySelector("#alert");
        const sound = document.querySelector("#alertSound");
        const sysLog = document.querySelector("#system-log");
        const weatherBlock = document.querySelector("#weather-data");

        if (data.flood_risk) {
          water.setAttribute("color", "#0044ff");
          alertText.setAttribute("value", "⚠️ FLOOD ALERT ⚠️");
          sound.components.sound.playSound();
          sysLog.setAttribute("value", "Flood detected — systems on alert.");
          weatherBlock.setAttribute("value", "Heavy rainfall, high humidity.");
          spawnRain();
        } else {
          water.setAttribute("color", "#003366");
          alertText.setAttribute("value", "");
          sound.components.sound.stopSound();
          sysLog.setAttribute("value", "Normal conditions.");
          weatherBlock.setAttribute("value", "Clear or moderate weather.");
          removeRain();
        }
      }

      // ⛈️ Rain Effect
      function spawnRain() {
        if (document.querySelector("#rain")) return;
        const rain = document.createElement("a-entity");
        rain.setAttribute("id", "rain");
        rain.setAttribute("particle-system", "preset: rain; color: #77ccff; particleCount: 1500");
        document.querySelector("a-scene").appendChild(rain);
      }

      function removeRain() {
        const rain = document.querySelector("#rain");
        if (rain) rain.remove();
      }

      // 🗣 Text Flow Animation
      function displayTextFlow(selector, text) {
        const el = document.querySelector(selector);
        el.setAttribute("value", "");
        let i = 0;
        const interval = setInterval(() => {
          if (i < text.length) {
            el.setAttribute("value", text.substring(0, i + 1));
            i++;
          } else clearInterval(interval);
        }, 35);
      }

      // 🔊 Speak once, in sync with display
      function speak(text) {
        if (aiSpeaking) return;
        aiSpeaking = true;
        const synth = window.speechSynthesis;
        synth.cancel(); // stop old voices
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-US";
        utter.pitch = 1;
        utter.rate = 0.95;
        utter.volume = 1;
        utter.onend = () => { aiSpeaking = false; };
        synth.speak(utter);
      }
    </script>
  </body>
</html>
